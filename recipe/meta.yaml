{% set version = "2.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-pan
  version: "{{ version|replace('-', '_') }}"

source:
  url:
    - {{ cran_mirror }}/src/contrib/pan_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/pan/pan_{{ version }}.tar.gz
  sha256: da501a2d4083aef8a8771f96d7de874a7236ee5e94a23ba9bbdc7cb3b1002722

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('fortran') }}        # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('m2w64_fortran') }}  # [win]
    - {{ posix }}filesystem            # [win]
    - {{ posix }}make
    - {{ posix }}sed                   # [win]
    - {{ posix }}coreutils             # [win]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('pan')"           # [not win]
    - "\"%R%\" -e \"library('pan')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=pan
  license: GPL-3.0-only
  summary: Multiple imputation for multivariate panel or clustered data.
  license_family: GPL3
  license_file: {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
